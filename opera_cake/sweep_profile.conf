# spectrum-cartographer :: OperaCake frequency-based switching profile
# Format: one rule per line ->  f_low_hz  f_high_hz  port
# OperaCake routes the active primary port to the listed secondary port (A0..A7/B0..B7)
# while the tuned center frequency falls in [f_low, f_high).
# Edit ports to match which antenna is wired where. Receive-only.

# low VHF/UHF wideband whip on A0
30000000      300000000     A0
# UHF band antenna on A1
300000000     1000000000    A1
# L-band patch on A2
1000000000    2000000000    A2
# 2.4 GHz band antenna on A3
2000000000    2600000000    A3
# upper band antenna on A4
2600000000    4000000000    A4
